name: Build ObsidianOptimization

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build
        run: gradle clean build --no-daemon --refresh-dependencies

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ObsidianOptimization-1.7.1
          path: build/libs/*.jar
          if-no-files-found: error
