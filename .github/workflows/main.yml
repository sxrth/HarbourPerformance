name: Build ObsidianOptimization

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
          cache-disabled: false

      - name: Check Java
        run: java -version

      - name: Check Gradle
        run: gradle --version

      - name: Clean
        run: gradle clean --no-daemon

      - name: Build
        run: gradle build --no-daemon --stacktrace --refresh-dependencies

      - name: List build files
        if: always()
        run: |
          echo "=== build/libs ==="
          ls -lah build/libs || true

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ObsidianOptimization-1.8.2
          path: build/libs/*.jar
          if-no-files-found: error
